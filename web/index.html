<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="description" content="Open-Chessable — Open-source spaced-repetition chess trainer">
  <title>Open-Chessable — SRS Chess Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav id="nav">
    <div class="nav-brand">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 21h8M12 17v4M5 4h14l-1.5 6L21 13H3l3.5-3L5 4z"/>
          <circle cx="12" cy="11" r="1"/>
        </svg>
      </span>
      <span class="brand-text">Open-Chessable</span>
    </div>
    <div class="nav-links">
      <a href="#dashboard" class="nav-link active" data-route="dashboard">Dashboard</a>
      <a href="#courses" class="nav-link" data-route="courses">Courses</a>
      <a href="#train" class="nav-link" data-route="train">Train</a>
      <a href="#import" class="nav-link" data-route="import">Import</a>
    </div>
  </nav>

  <!-- Main content area -->
  <main id="main-content">
    <!-- Pages rendered here by app.js -->
  </main>

  <!-- Modal container -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-content" class="modal-content"></div>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/board.js"></script>
  <script src="/js/courses.js"></script>
  <script src="/js/trainer.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
