<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0f">
  <title>Open-Chessable — SRS Chess Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">♞</span>
        <span class="brand-name">Open-Chessable</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#dashboard" class="nav-item active" data-route="dashboard">
          <span class="nav-icon">◈</span>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="#courses" class="nav-item" data-route="courses">
          <span class="nav-icon">▤</span>
          <span class="nav-label">Courses</span>
        </a>
        <a href="#train" class="nav-item" data-route="train">
          <span class="nav-icon">◎</span>
          <span class="nav-label">Train</span>
        </a>
        <a href="#import" class="nav-item" data-route="import">
          <span class="nav-icon">⇪</span>
          <span class="nav-label">Import</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="stats-mini" id="sidebar-stats">—</div>
      </div>
    </aside>

    <!-- Main content -->
    <main id="main-content">
      <!-- Rendered by app.js -->
    </main>
  </div>

  <!-- Modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-content" class="modal-content"></div>
  </div>

  <!-- Toast -->
  <div id="toast-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/board.js"></script>
  <script src="/js/courses.js"></script>
  <script src="/js/trainer.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
